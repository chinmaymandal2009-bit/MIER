<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08152b"><title>Parent Portal | MIER</title>
<style>
:root{color-scheme:dark;--gold:#d5b15b;--cream:#f2dfaa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 5%,#d5b15b20,transparent 35%),linear-gradient(135deg,#071225,#10284a);color:#f8faff;font:16px/1.6 system-ui,Arial}.top{height:5px;background:linear-gradient(90deg,#08152b,#d5b15b,#fff0bd,#08152b)}header{padding:22px 6%;border-bottom:1px solid #d5b15b50;font-weight:900;letter-spacing:1px}header small{display:block;color:#b6c3d6;font-size:11px;letter-spacing:2px}.wrap{max-width:900px;margin:35px auto;padding:0 18px 60px}.panel{padding:clamp(22px,5vw,42px);background:#102341eF;border:1px solid #d5b15b65;border-radius:14px;box-shadow:0 25px 70px #0005}h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:10px 0;color:var(--cream)}p{color:#bdc9da}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:3px}label{display:block;margin:17px 0 6px;font-weight:700;font-size:14px}input{width:100%;padding:14px;border-radius:7px;border:1px solid #ffffff35;background:#07162d;color:white;font:inherit}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:7px;background:var(--gold);color:#101b2d;font-weight:900;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.msg{margin-top:15px;color:var(--cream);font-size:14px;overflow-wrap:anywhere}.result{margin-top:25px;display:none}.student{padding:20px;background:#07162d;border:1px solid #d5b15b55;border-radius:10px}.student h2{margin:0;color:var(--cream)}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:15px}.meta div{padding:12px;background:#ffffff09;border-radius:7px;overflow-wrap:anywhere}.meta small{display:block;color:#aebbd0}.tablewrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #ffffff20}th{color:var(--cream)}.empty{color:#bdc9da}footer{text-align:center;padding:20px;color:#93a4bc;font-size:12px}@media(max-width:500px){.wrap{margin-top:20px}.panel{padding:22px 16px}}
</style></head><body><div class="top"></div><header>MIER <small>MALDA INSTITUTE OF EDUCATION AND RESEARCH</small></header>
<main class="wrap"><section class="panel"><div class="eyebrow">FAMILY ACCESS</div><h1>Parent Portal</h1><p>Enter your child's full name and the Parent PIN provided by the school. Only the matching student's record will be shown.</p>
<form id="lookup"><label for="child-name">Child's full name</label><input id="child-name" autocomplete="name" maxlength="120" required placeholder="Enter exact name as recorded by school"><label for="parent-pin">6-digit Parent PIN</label><input id="parent-pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="••••••"><button id="search-btn" type="submit">Verify & View Record</button></form><div id="message" class="msg" role="status" aria-live="polite"></div>
<section id="result" class="result"><div class="student"><h2 id="student-name"></h2><div class="meta" id="student-meta"></div></div><h2>Attendance</h2><p id="attendance-summary"></p><div class="tablewrap"><table><thead><tr><th>Date</th><th>Class</th><th>Status</th></tr></thead><tbody id="attendance-rows"></tbody></table></div></section>
</section></main><footer>MIER · Parent information is displayed after PIN verification.</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";
const app=initializeApp({apiKey:"AIzaSyC7nq8YQODQwryIMkGvUY-nPDfvV45Jf_k",authDomain:"mier-student-records.firebaseapp.com",projectId:"mier-student-records",storageBucket:"mier-student-records.firebasestorage.app",messagingSenderId:"856674166722",appId:"1:856674166722:web:b1da4aed5a2e451d0bd85b"});
const lookup=httpsCallable(getFunctions(app,"asia-south1"),"parentStudentLookup");
const $=id=>document.getElementById(id);
$("lookup").addEventListener("submit",async e=>{e.preventDefault();$("result").style.display="none";$("message").textContent="Verifying…";$("search-btn").disabled=true;try{const response=await lookup({name:$("child-name").value.trim(),pin:$("parent-pin").value.trim()});const data=response.data;const s=data.student;$("student-name").textContent=s.name||"Student";const items=[["Student ID",s.studentId],["Class",s.classSection],["Roll",s.roll],["Academic year",s.academicYear],["Status",s.status]];$("student-meta").replaceChildren(...items.map(([label,value])=>{const box=document.createElement("div");const small=document.createElement("small");small.textContent=label;const strong=document.createElement("strong");strong.textContent=value||"—";box.append(small,strong);return box;}));const rows=$("attendance-rows");rows.replaceChildren();for(const a of (data.attendance||[])){const tr=document.createElement("tr");for(const value of [a.date,a.classSection,a.status]){const td=document.createElement("td");td.textContent=value||"—";tr.append(td);}rows.append(tr);} $("attendance-summary").textContent=(data.attendance||[]).length+" attendance record(s) available.";if(!(data.attendance||[]).length){const tr=document.createElement("tr");const td=document.createElement("td");td.colSpan=3;td.className="empty";td.textContent="No attendance records found.";tr.append(td);rows.append(tr);} $("message").textContent="Verified successfully."; $("result").style.display="block";}catch(err){console.error(err);$("message").textContent=err.code==="functions/resource-exhausted"?"Too many attempts. Please wait 15 minutes and try again.":(err.code==="functions/not-found"?"Name or PIN did not match. Please check with the school.":"Unable to verify right now. Please try again later.");}finally{$("search-btn").disabled=false;}});
</script></body></html>
